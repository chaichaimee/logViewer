summary = "ログビューア"
description = """LogViewerは、開発者やパワーユーザー向けのNVDAログ分析を大幅に強化します。ログビューアや外部テキストエディターを、高度な正規表現検索、カスタムブックマーク、クイックナビゲーションを備えたインタラクティブな作業スペースへと変換します。主な機能には、バックグラウンドスレッドスキャン、前回のセッションログにおける自動クラッシュブックマーク、クリップボードへの高度な複数行エラーブロック抽出、セグメント化されたログセグメントのコピー、および自動アプリ競合パススルーを備えた柔軟な設定オプションが含まれます。

ホットキー：
CTRL+F : 検索ダイアログを開く
CTRL+F2 : ブックマークを追加
F2 : ログ内の次のブックマークに移動
Shift+F2 : ログ内の前のブックマークに移動

CTRL+Shift+F2
シングルタップ : 最新のブックマーク以降のログをコピー
ダブルタップ : 古いブックマークを順にさかのぼりながら各セグメントをコピー
トリプルタップ : または現在と過去のログを切り替え

F3
シングルタップ : 次を検索
ダブルタップ : エラーログレベルをコピー

Shift+F3 : 前を検索
NVDA+CTRL+L : 古いログファイルを開く"""