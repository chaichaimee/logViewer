summary = "Visualizador de Log"
description = """O LogViewer potencializa a análise de logs do NVDA para desenvolvedores e usuários avançados. Ele converte o Visualizador de Log e editores de texto externos em um espaço de trabalho interativo com busca avançada por expressão regular, marcadores personalizados e navegação rápida. Os principais recursos incluem varredura em segundo plano, marcadores automáticos de falha em logs de sessões anteriores, extração inteligente de blocos de erro multilinha para a área de transferência, cópia de segmentos de log particionados e opções de configuração flexíveis com passagem automática de conflitos entre aplicativos.

Teclas de Atalho:
CTRL+F : Abrir caixa de diálogo de pesquisa
CTRL+F2 : Adicionar marcador
F2 : Ir para o próximo marcador no log
Shift+F2 : Ir para o marcador anterior no log

CTRL+Shift+F2
Toque único : Copiar log desde o último marcador
Toque duplo : retroceder pelos marcadores mais antigos copiando o segmento de cada um
Toque triplo : ou alternar entre o log atual e o antigo

F3
Toque único : Localizar próxima ocorrência
Toque duplo : copiar nível de log de erro

Shift+F3 : Localizar ocorrência anterior
NVDA+CTRL+L : abrir arquivo de log antigo"""