summary = "Visor de registro"
description = """LogViewer potencia el análisis de registros de NVDA para desarrolladores y usuarios avanzados. Convierte el Visor de registro y los editores de texto externos en un espacio de trabajo interactivo con búsqueda avanzada por expresiones regulares, marcadores personalizados y navegación rápida. Entre sus características principales se incluyen el análisis en segundo plano, marcadores automáticos de fallos en registros de sesiones anteriores, extracción inteligente de bloques de errores multilínea al portapapeles, copia de segmentos de registro y opciones de configuración flexibles con transferencia automática en conflictos de aplicaciones.

Teclas de acceso rápido:
CTRL+F : Abrir diálogo de búsqueda
CTRL+F2 : Añadir marcador
F2 : Ir al siguiente marcador en el registro
Shift+F2 : Ir al marcador anterior en el registro

CTRL+Shift+F2
Pulsación simple : Copiar registro desde el último marcador
Doble pulsación : Retroceder por marcadores anteriores copiando el segmento de cada uno
Triple pulsación : o cambiar entre el registro actual y el antiguo

F3
Pulsación simple : Buscar siguiente coincidencia
Doble pulsación : Copiar nivel de registro de error

Shift+F3 : Buscar coincidencia anterior
NVDA+CTRL+L : Abrir archivo de registro anterior"""