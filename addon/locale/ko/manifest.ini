summary = "로그 뷰어"
description = """로그 뷰어는 개발자와 파워 유저를 위해 NVDA 로그 분석 기능을 대폭 강화합니다. 로그 뷰어와 외부 텍스트 편집기를 고급 정규식 검색, 사용자 지정 책갈피, 빠른 탐색 기능을 갖춘 대화형 작업 공간으로 전환합니다. 주요 기능으로는 백그라운드 스레드 스캔, 이전 세션 로그의 자동 충돌 책갈피, 클립보드로의 지능형 여러 줄 오류 블록 추출, 분할된 로그 세그먼트 복사, 자동 앱 충돌 패스스루를 지원하는 유연한 구성 옵션이 있습니다.

단축키:
CTRL+F : 검색 대화상자 열기
CTRL+F2 : 책갈피 추가
F2 : 로그 내 다음 책갈피로 이동
Shift+F2 : 로그 내 이전 책갈피로 이동

CTRL+Shift+F2
한 번 탭 : 최신 책갈피 이후의 로그 복사
두 번 탭 : 각 책갈피의 세그먼트를 복사하며 이전 책갈피로 거슬러 올라감
세 번 탭 : 또는 현재 로그와 이전 로그 간 전환

F3
한 번 탭 : 다음 항목 찾기
두 번 탭 : 오류 로그 수준 복사

Shift+F3 : 이전 항목 찾기
NVDA+CTRL+L : 이전 로그 파일 열기"""