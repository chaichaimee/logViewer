summary = "Penampil Log"
description = """LogViewer meningkatkan analisis log NVDA untuk pengembang dan pengguna mahir. Ini mengubah Penampil Log dan editor teks eksternal menjadi ruang kerja interaktif dengan pencarian regex tingkat lanjut, penanda khusus, dan navigasi cepat. Sorotan fitur meliputi pemindaian utas latar belakang, penanda kram otomatis pada log sesi sebelumnya, ekstraksi blok kesalahan multi-baris yang cerdas ke papan klip, penyalinan segmen log tersegmentasi, dan opsi konfigurasi yang fleksibel dengan penerusan konflik aplikasi otomatis.

Tombol Cepat:
CTRL+F : Buka dialog pencarian
CTRL+F2 : Tambah penanda
F2 : Pindah ke penanda berikutnya dalam log
Shift+F2 : Pindah ke penanda sebelumnya dalam log

CTRL+Shift+F2
Ketukan Tunggal : Salin log sejak penanda terakhir
Ketukan Ganda : Mundur melalui penanda yang lebih lama, menyalin segmen masing-masing
Ketukan Tiga Kali : atau beralih antara log saat ini dan log lama

F3
Ketukan Tunggal : Cari kemunculan berikutnya
Ketukan Ganda : Salin tingkat log kesalahan

Shift+F3 : Cari kemunculan sebelumnya
NVDA+CTRL+L : Buka berkas log lama"""