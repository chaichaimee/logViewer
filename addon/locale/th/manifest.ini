summary = "ตัวแสดงบันทึก"
description = """LogViewer ช่วยเพิ่มประสิทธิภาพในการวิเคราะห์บันทึกของ NVDA สำหรับนักพัฒนาและผู้ใช้ขั้นสูง โดยจะแปลงตัวแสดงบันทึกและโปรแกรมแก้ไขข้อความภายนอกให้เป็นพื้นที่ทำงานแบบอินเทอร์แอกทีฟ พร้อมการค้นหาด้วยregexขั้นสูง บุ๊กมาร์กกำหนดเอง และการนำทางอย่างรวดเร็ว จุดเด่นของฟีเจอร์ประกอบด้วย การสแกนด้วยเธรดเบื้องหลัง, บุ๊กมาร์กการขัดข้องอัตโนมัติในบันทึกเซสชันก่อนหน้า, การดึงข้อมูลบล็อกข้อผิดพลาดหลายบรรทัดอัจฉริยะไปยังคลิปบอร์ด, การคัดลอกส่วนของบันทึกแบบแบ่งส่วน และตัวเลือกการกำหนดค่าที่ยืดหยุ่นพร้อมการส่งผ่านข้อขัดแย้งของแอปอัตโนมัติ

ปุ่มลัด:
CTRL+F : เปิดกล่องโต้ตอบค้นหา
CTRL+F2 : เพิ่มบุ๊กมาร์ก
F2 : ไปยังบุ๊กมาร์กถัดไปในบันทึก
Shift+F2 : ไปยังบุ๊กมาร์กก่อนหน้าในบันทึก

CTRL+Shift+F2
แตะครั้งเดียว : คัดลอกบันทึกตั้งแต่บุ๊กมาร์กล่าสุด
แตะสองครั้ง : ย้อนกลับทีละขั้นตอนผ่านบุ๊กมาร์กเก่าๆ พร้อมคัดลอกส่วนของแต่ละบุ๊กมาร์ก
แตะสามครั้ง : หรือสลับระหว่างบันทึกปัจจุบันและบันทึกเก่า

F3
แตะครั้งเดียว : หาตำแหน่งถัดไป
แตะสองครั้ง : คัดลอกระดับบันทึกข้อผิดพลาด

Shift+F3 : หาตำแหน่งก่อนหน้า
NVDA+CTRL+L : เปิดไฟล์บันทึกเก่า"""