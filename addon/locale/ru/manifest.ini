summary = "Просмотр журнала"
description = """LogViewer расширяет возможности анализа журналов NVDA для разработчиков и опытных пользователей. Он превращает стандартное окно просмотра журнала и внешние текстовые редакторы в интерактивную рабочую среду с расширенным поиском по регулярным выражениям, пользовательскими закладками и быстрой навигацией. Основные функции включают сканирование в фоновом потоке, автоматическое создание закладок сбоев в журналах предыдущих сеансов, интеллектуальное извлечение многострочных блоков ошибок в буфер обмена, по сегментное копирование журналов и гибкие параметры настройки с автоматическим пропуском конфликтов приложений.

Горячие клавиши:
CTRL+F : Открыть диалог поиска
CTRL+F2 : Добавить закладку
F2 : Перейти к следующей закладке в журнале
Shift+F2 : Перейти к предыдущей закладке в журнале

CTRL+Shift+F2
Одинарное нажатие : Копировать журнал с момента последней закладки
Двойное нажатие : пошаговый переход по старым закладкам с копированием сегмента каждой из них
Тройное нажатие : или переключение между текущим и старым журналом

F3
Одинарное нажатие : Найти следующее совпадение
Двойное нажатие : скопировать уровень журнала ошибок

Shift+F3 : Найти предыдущее совпадение
NVDA+CTRL+L : открыть файл старого журнала"""