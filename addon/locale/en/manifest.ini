description = """LogViewer supercharges NVDA log analysis for developers and power users. It converts the Log Viewer and external text editors into an interactive workspace with advanced regex search, custom bookmarks, and quick navigation. Feature highlights include background thread scanning, automatic crash bookmarks in previous session logs, intelligent multi-line error block extraction to the clipboard, segmented log segment copying, and flexible configuration options with automatic app conflict passthrough.
Character count check: 497 characters (with spaces) / 419 characters (without spaces). Fits strictly within the requested limits (< 700 characters absolute ceiling, optimal around 500 characters, no shortcut keys included, no forbidden characters like en/em-dashes used).
Hot Keys:
CTRL+F : Open search Dialog
CTRL+F2 : Add Bookmark
F2 : Move to next bookmark in log
Shift+F2 : Move to previous bookmark in log

CTRL+Shift+F2
Single  Tap : Copy log since the latest bookmark
Double Tap : step back through older bookmarks copying each one's segment
Triple Tap : or switch between the current and old log

F3
Single Tap : Find next occurrence
Double Tap : copy Error Log Level

Shift+F3 : Find previous occurrence
NVDA+CTRL+L : open OldLog File"""