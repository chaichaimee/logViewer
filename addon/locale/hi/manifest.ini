summary = "लॉग व्यूअर"
description = """लॉगव्यूअर डेवलपर्स और पावर यूज़र के लिए एनवीडीए लॉग विश्लेषण को और बेहतर बनाता है। यह लॉग व्यूअर और बाहरी टेक्स्ट संपादकों को उन्नत रेगुलर एक्सप्रेसन खोज, कस्टम बुकमार्क और त्वरित नेविगेशन के साथ एक इंटरैक्टिव कार्यक्षेत्र में बदल देता है। इसकी मुख्य विशेषताओं में बैकग्राउंड थ्रेड स्कैनिंग, पिछले सत्र के लॉग में स्वचालित क्रैश बुकमार्क, क्लिपबोर्ड पर इंटेलिजेंट मल्टी-लाइन एरर ब्लॉक निष्कर्षण, खंडित लॉग सेगमेंट कॉपी करना, और स्वचालित ऐप कॉन्फ्लिक्ट पासथ्रू के साथ लचीले कॉन्फ़िगरेशन विकल्प शामिल हैं।

हॉट कीज़:
CTRL+F : खोज संवाद खोलें
CTRL+F2 : बुकमार्क जोड़ें
F2 : लॉग में अगले बुकमार्क पर जाएं
Shift+F2 : पिछले बुकमार्क पर जाएं

CTRL+Shift+F2
सिंगल टैप : नवीनतम बुकमार्क के बाद का लॉग कॉपी करें
डबल टैप : प्रत्येक सेगमेंट को कॉपी करते हुए पुराने बुकमार्क पर वापस जाएं
ट्रिपल टैप : या वर्तमान और पुराने लॉग के बीच स्विच करें

F3
सिंगल टैप : अगला मिलान खोजें
डबल टैप : एरर लॉग लेवल कॉपी करें

Shift+F3 : पिछला मिलान खोजें
NVDA+CTRL+L : पुराना लॉग फ़ाइल खोलें"""