summary = "Protokollbetrachter"
description = """LogViewer erweitert die NVDA-Protokollanalyse für Entwickler und fortgeschrittene Benutzer erheblich. Es verwandelt den Protokollbetrachter und externe Texteditoren in einen interaktiven Arbeitsbereich mit erweiterter Regex-Suche, benutzerdefinierten Lesezeichen und schneller Navigation. Zu den Highlights gehören Hintergrund-Thread-Scans, automatische Absturz-Lesezeichen in Protokollen vorheriger Sitzungen, intelligente Extrahierung mehrzeiliger Fehlerblöcke in die Zwischenablage, segmentiertes Kopieren von Protokollabschnitten und flexible Konfigurationsoptionen mit automatischer Weiterleitung bei App-Konflikten.

Tasten:
STRG+F: Suchdialog öffnen
STRG+F2: Lesezeichen hinzufügen
F2: Zum nächsten Lesezeichen im Protokoll springen
Umschalt+F2: Zum vorherigen Lesezeichen im Protokoll wechseln

STRG+Umschalt+F2
Einzelnes Tippen: Protokoll seit dem letzten Lesezeichen kopieren
Doppelter Tipp: Durch ältere Lesezeichen zurückgehen und jeweils das Segment kopieren
Dreimaliges Tippen: Zwischen aktuellem und altem Protokoll umschalten

F3
Einfachtippen: Nächstes Vorkommen finden
Doppelter Tipp: Fehlerprotokollstufe kopieren

Umschalt+F3: Vorheriges Vorkommen finden
NVDA+CTRL+L: Alte Protokolldatei öffnen"""