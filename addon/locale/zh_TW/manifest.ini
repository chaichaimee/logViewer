summary = "記錄檢視器"
description = """記錄檢視器（LogViewer）為開發人員和進階使用者強化了 NVDA 記錄分析功能。它將記錄檢視器和外部文字編輯器轉換為互動式工作區，具備進階正規表示式搜尋、自訂書籤和快速導覽功能。功能亮點包括背景執行緒掃描、先前工作階段記錄中的自動當機書籤、智慧型多行錯誤區塊擷取至剪貼簿、分段記錄區段複製，以及具備自動應用程式衝突略過功能的彈性設定選項。

熱鍵：
CTRL+F：開啟搜尋對話方塊
CTRL+F2：新增書籤
F2：移至記錄中的下一個書籤
Shift+F2：移至記錄中的上一個書籤

CTRL+Shift+F2
單擊：複製自最新書籤以來的記錄
雙擊：逐步往回瀏覽較舊的書籤並複製每個區段
三擊：或在目前記錄與舊記錄之間切換

F3
單擊：尋找下一個符合項目
雙擊：複製錯誤記錄層級

Shift+F3：尋找上一個符合項目
NVDA+CTRL+L：開啟舊記錄檔"""