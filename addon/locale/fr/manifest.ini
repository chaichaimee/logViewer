summary = "Visionneure de journal"
description = """LogViewer décuple l'analyse des journaux NVDA pour les développeurs et les utilisateurs avancés. Il transforme la visionneuse de journal et les éditeurs de texte externes en un espace de travail interactif doté d'une recherche par expressions régulières avancée, de signets personnalisés et d'une navigation rapide. Parmi les points forts figurent l'analyse en arrière-plan, les signets de plantage automatiques dans les journaux de la session précédente, l'extraction intelligente de blocs d'erreurs multilignes vers le presse-papiers, la copie de segments de journal segmentés et des options de configuration flexibles avec transmission automatique des conflits d'applications.

Raccourcis clavier :
CTRL+F : Ouvrir la boîte de dialogue de recherche
CTRL+F2 : Ajouter un signet
F2 : Aller au signet suivant dans le journal
Maj+F2 : Aller au signet précédent dans le journal

CTRL+Maj+F2
Simple appui : Copier le journal depuis le dernier signet
Double appui : Reculer parmi les anciens signets en copiant le segment de chacun
Triple appui : ou basculer entre le journal actuel et l'ancien journal

F3
Simple appui : Rechercher la occurrence suivante
Double appui : Copier le niveau du journal des erreurs

Maj+F3 : Rechercher la occurrence précédente
NVDA+CTRL+L : Ouvrir l'ancien fichier journal"""