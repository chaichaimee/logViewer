summary = "عارض السجل"
description = """يعزز LogViewer تحليل سجل NVDA للمطورين والمستخدمين المحترفين. فهو يحول عارض السجل ومحررات النصوص الخارجية إلى مساحة عمل تفاعلية تتميز بالبحث المتقدم بتعابير البحث النمطية (regex)، والعلامات المرجعية المخصصة، والتنقل السريع. تشمل أبرز الميزات مسح خيط الخلفية (background thread)، والعلامات المرجعية التلقائية للأعطال في سجلات الجلسة السابقة، واستخراج كتل الأخطاء الذكية متعددة الأسطر إلى الحافظة، ونسخ أقسام السجل المقسمة، وخيارات التكوين المرنة مع التمرير التلقائي لتضارب التطبيقات.

مفاتيح الاختصار:
CTRL+F : فتح مربع حوار البحث
CTRL+F2 : إضافة علامة مرجعية
F2 : الانتقال إلى العلامة المرجعية التالية في السجل
Shift+F2 : الانتقال إلى العلامة المرجعية السابقة في السجل

CTRL+Shift+F2
نقرة واحدة : نسخ السجل منذ أحدث علامة مرجعية
نقرة مزدوجة : التراجع عبر العلامات المرجعية الأقدم مع نسخ قسم كل منها
ثلاث نقرات : أو التبديل بين السجل الحالي والقديم

F3
نقرة واحدة : العثور على التكرار التالي
نقرة مزدوجة : نسخ مستوى سجل الأخطاء

Shift+F3 : العثور على التكرار السابق
NVDA+CTRL+L : فتح ملف السجل القديم"""