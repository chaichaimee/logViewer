summary = "Переглядач журналу"
description = """LogViewer значно покращує аналіз журналу NVDA для розробників та досвідчених користувачів. Він перетворює Переглядач журналу та зовнішні текстові редактори на інтерактивний робочий простір із розширеним пошуком за регулярними виразами, власними закладками та швидкою навігацією. Основні функції включають сканування у фоновому потоці, автоматичні закладки збоїв у логах попередньої сесії, інтелектуальне вилучення багаторядкових блоків помилок до буфера обміну, копіювання сегментів журналу та гнучкі параметри конфігурації з автоматичним пропуском конфліктів додатків.

Гарячі клавіші:
CTRL+F : Відкрити діалог пошуку
CTRL+F2 : Додати закладку
F2 : Пере перейти до наступної закладки в журналі
Shift+F2 : Перейти до попередньої закладки в журналі

CTRL+Shift+F2
Одинарне торкання : Скопіювати журнал з моменту останньої закладки
Подвійне торкання : Крок за кроком переглядати старі закладки, копіюючи сегмент кожної з них
Потрійне торкання : або перемикатися між поточним і старим журналом

F3
Одинарне торкання : Знайти наступне входження
Подвійне торкання : Скопіювати рівень журналу помилок

Shift+F3 : Знайти попереднє входження
NVDA+CTRL+L : Відкрити файл старого журналу"""