summary = "日志查看器"
description = """LogViewer 增强了 NVDA 的日志分析功能，专为开发者和高级用户打造。它将日志查看器和外部文本编辑器转变为一个交互式工作区，提供高级正则表达式搜索、自定义书签和快速导航。核心功能包括：后台线程扫描、自动标记前一次会话日志中的崩溃点、智能提取多行错误块到剪贴板、分段复制日志段，以及带有自动应用冲突透传功能的灵活配置选项。

快捷键：
CTRL+F：打开搜索对话框
CTRL+F2：添加书签
F2：跳转到日志中的下一个书签
Shift+F2：跳转到日志中的上一个书签

CTRL+Shift+F2
单击：复制自最新书签以来的日志
双击：按时间顺序向后遍历较旧的书签并复制每个书签的日志段
三击：或在当前日志与旧日志之间切换

F3
单击：查找下一个匹配项
双击：复制错误日志级别

Shift+F3：查找上一个匹配项
NVDA+CTRL+L：打开旧日志文件"""